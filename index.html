<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Calculator</title>
    <script src="first-row-buttons.js?v=1.0"></script>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <h3>Welcome to the Project Calculator!</h3>
    <div id="calculator">
        <input id="display-box" readonly>
        <button class="mod" onclick="buttonFunctions('%')">mod</button>
        <button class="operator" onclick="buttonFunctions('&pi;')">&pi;</button>
        <button class="operator" onclick="buttonFunctions('*')">x</button>
        <button class="operator" onclick="buttonFunctions('&divide;')">&divide;</button>
        <button class="operator" onclick="buttonFunctions('1')">1</button>
        <button class="operator" onclick="buttonFunctions('2')">2</button>
        <button class="operator" onclick="buttonFunctions('3')">3</button>
        <button class="operator" onclick="buttonFunctions('4')">4</button>
        <button class="operator" onclick="buttonFunctions('5')">5</button>
    </div>
</body>
</html>
